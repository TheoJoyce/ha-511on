[project]
name = "ha-511on"
version = "0.0.1"
description = "Community-maintained Home Assistant integration for Ontario 511 traffic data."
readme = "README.md"
requires-python = ">=3.14.2"
license = "Apache-2.0"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "pytest-homeassistant-custom-component",
  "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I", "F", "E", "W", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
files = ["custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
