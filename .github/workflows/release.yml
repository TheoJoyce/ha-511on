name: Release

# Merging a release's pull request into main publishes it: the merge commit
# is tagged v<version> from manifest.json, and the release notes are that
# version's section of CHANGELOG.md, reviewed in that pull request. Alpha,
# beta and rc versions are pre-releases, which HACS only offers to users who
# turn on beta versions. A merge whose version already has a tag publishes
# nothing.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version custom_components/ontario_511/manifest.json)
          project=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$version" != "$project" ]; then
            echo "::error::manifest.json ($version) and pyproject.toml ($project) differ"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag already exists; nothing to release"
            exit 0
          fi
          # The lines under "## [<version>]", up to the next version.
          awk -v heading="## [$VERSION]" '
            index($0, "## [") == 1 { found = index($0, heading) == 1; next }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat >> notes.md <<'FOOTER'

          ---

          Community-maintained; not affiliated with or endorsed by Ontario 511, the Ministry of Transportation, or the Government of Ontario.

          Data: contains information licensed under the [Open Government Licence – Ontario](https://www.ontario.ca/page/open-government-licence-ontario).
          FOOTER
          case "$VERSION" in
            *-*) channel=(--prerelease --latest=false) ;;
            *) channel=(--latest) ;;
          esac
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file notes.md \
            "${channel[@]}"
