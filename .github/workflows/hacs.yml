name: Marketplace

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # The "Protect main" ruleset requires a check with this job name.
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Marketplace validation
        uses: hacs/action@main
        with:
          category: integration
